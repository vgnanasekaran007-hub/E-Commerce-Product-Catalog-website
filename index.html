<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A premium modern e-commerce product catalog with interactive filters, cart, wishlist, and smooth transitions." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <title>AURA — Premium E-Commerce Catalog</title>
  </head>
  <body>
    <div id="app">
      <!-- Nav/Header will render here -->
      <header id="header-container"></header>
      
      <!-- Main Content Container -->
      <main id="main-container" class="page-content"></main>
      
      <!-- Footer will render here -->
      <footer id="footer-container"></footer>
      
      <!-- Toast Notification Container -->
      <div id="toast-container" class="toast-container"></div>
      
      <!-- Mobile Nav Overlay -->
      <div id="mobile-overlay" class="overlay"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
